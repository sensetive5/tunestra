name: Release

on:
  push:
    branches: [main]

# One release at a time; a newer push waits for the current run.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # Push the release commit and tags, create the GitHub release.
  contents: write
  # Open and update the release pull request.
  pull-requests: write
  # Publish to npm with trusted publishing: no npm token is stored anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: Release a new version
          pr-title: Release a new version
